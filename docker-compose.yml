services:

  postgres:
    image: postgres:17
    container_name: medimap-postgres

    environment:
      POSTGRES_DB: medimap
      POSTGRES_USER: medimap
      POSTGRES_PASSWORD: medimap

    command:
      - postgres
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off

    ports:
      - "5432:5432"

    volumes:
      - medimap_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medimap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./medimap-backend
      dockerfile: Dockerfile.dev

    container_name: medimap-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}

    ports:
      - "8080:8080"

    volumes:
      - ./medimap-backend:/app
      - maven-cache:/root/.m2

volumes:
  medimap_postgres_data:
  maven-cache: